# x.sdkmini.com — Follower Mosaic product page (static site, no backend).
# Source: github.com/hezongkun/follower-mosaic site/. Cloudflare record is DNS-only (grey).
# Port 80: ACME http-01 (acme.sh webroot) + 301 to https. 443: Let's Encrypt ec-256 via acme.sh.
server {
    listen 80;
    listen [::]:80;
    server_name x.sdkmini.com;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /usr/share/nginx/html;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name x.sdkmini.com;

    ssl_certificate     /www/sites/x.sdkmini.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/x.sdkmini.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLxsdk:10m;
    ssl_session_timeout 1d;

    access_log /www/sites/x.sdkmini.com/log/access.log;
    error_log  /www/sites/x.sdkmini.com/log/error.log;

    root /www/sites/x.sdkmini.com/index;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # HTML: always revalidate so content updates show up immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Images and icons: long cache (rename the file when replacing an asset).
    location /assets/ {
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /downloads/ {
        expires 1d;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
